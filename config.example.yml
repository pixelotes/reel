# Reel Configuration Example
# Complete configuration with all Phase 1-6 features

# Application Settings
app:
  port: 8080
  debug: false
  data_path: "./data"

# Database Configuration
database:
  path: "./data/reel.db"

# Plex Configuration
plex:
  url: "http://localhost:32400"
  token: "your-plex-token"
  update_on_new_media: true

# Torrent Client Configuration
torrent:
  type: "qbittorrent"  # qbittorrent, transmission, or mock
  url: "http://localhost:8080"
  username: "admin"
  password: "adminpass"
  download_path: "/downloads"
  category: "reel"

# Subtitles Configuration (Phase 4 enhancements)
subtitles:
  enabled: true
  api_key: "your-opensubtitles-api-key"
  languages:
    - "en"
    - "es"
  # Phase 4: Rate limiting is automatic (5 req/min)
  # Phase 4: Retry logic is automatic (3 attempts with exponential backoff)

# Media Library Configuration
media:
  movie_path: "/media/movies"
  tv_path: "/media/shows"
  anime_path: "/media/anime"
  naming:
    movie_template: "{title} ({year}) [{quality}]"
    tv_template: "{title} - S{season:02d}E{episode:02d} [{quality}]"

# Postprocessing Configuration (Phase 1-6)
postprocessing:
  # Phase 1: Basic settings
  enabled: true
  validate_files: true
  min_file_size_mb: 100
  wait_for_file_timeout: 60
  retry_attempts: 3
  retry_delay: 10
  cleanup_on_failure: true
  keep_failed_downloads_days: 7

  # Phase 2-6: Pipeline configuration
  pipeline:
    enabled: true    # Phase 2: Enable pipeline architecture
    rollback: true   # Phase 2: Auto-rollback on failure

    # Phase 3: Configurable stages with conditions
    stages:
      # Phase 6: Pre-flight checks
      - name: permission_check
        enabled: true

      - name: space_check
        enabled: true

      # Phase 6: Archive extraction
      - name: extract
        enabled: true

      # Phase 6: File health verification
      - name: health_check
        enabled: true

      # Phase 2: File validation
      - name: validate
        enabled: true

      # Phase 6: Add metadata
      - name: enrich_metadata
        enabled: true

      # Phase 6: Check for duplicates (movies only)
      - name: duplicate_check
        enabled: true
        condition: "is_movie"

      # Phase 2: Create directory structure
      - name: create_folders
        enabled: true

      # Phase 2: Move/link files
      - name: move_files
        enabled: true

      # Phase 2: Apply naming template
      - name: rename
        enabled: true

      # Phase 2/4: Download subtitles (with rate limiting & retry)
      - name: subtitles
        enabled: true

      # Phase 2: Send notifications
      - name: notify
        enabled: true

# Scheduled Tasks Configuration
scheduled_tasks:
  # Check overseerr for new requests
  check_overseerr:
    enabled: true
    interval: "5m"

  # Search for approved torrents
  search_torrents:
    enabled: true
    interval: "10m"

  # Check torrent completion
  check_downloads:
    enabled: true
    interval: "1m"

  # Process completed downloads
  process_completed:
    enabled: true
    interval: "2m"

  # Clean up old failed downloads
  cleanup_failed:
    enabled: true
    interval: "24h"

  # Phase 5: Clean up old processing states
  cleanup_states:
    enabled: true
    interval: "24h"
    max_age_days: 7

# Overseerr Configuration
overseerr:
  url: "http://localhost:5055"
  api_key: "your-overseerr-api-key"

# Notifications Configuration
notifications:
  pushbullet:
    enabled: false
    api_key: "your-pushbullet-api-key"

# Rejection Rules
rejection:
  min_seeders: 3
  max_size_gb: 50
  blocked_uploaders:
    - "fake-uploader"
  quality_preference:
    - "1080p"
    - "720p"
    - "2160p"
